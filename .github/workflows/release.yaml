name: Release

# Publishes the version in package.json on every merge to main. If a v<version>
# tag already exists the release is skipped, so bump the version to ship.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this version is already released
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already released; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Package
        if: steps.version.outputs.skip != 'true'
        run: npx --yes @vscode/vsce@3 package --out "buildkite-vscode-${{ steps.version.outputs.version }}.vsix"

      # --skip-duplicate makes re-runs safe if a later step failed.
      - name: Publish to VS Code Marketplace
        if: steps.version.outputs.skip != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3 publish --skip-duplicate --packagePath buildkite-vscode-*.vsix

      - name: Publish to Open VSX
        if: steps.version.outputs.skip != 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not set; skipping Open VSX."
            exit 0
          fi
          npx --yes ovsx@0 publish buildkite-vscode-*.vsix --skip-duplicate

      # Runs last: the tag is what marks a version as released.
      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" buildkite-vscode-*.vsix \
            --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --generate-notes
