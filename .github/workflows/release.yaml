name: Release

# Publishes the version in package.json on every merge to main. If a v<version>
# tag already exists the release is skipped, so bump the version to ship.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC trusted publishing (Marketplace and Open VSX)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this version is already released
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already released; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Package
        if: steps.version.outputs.skip != 'true'
        run: npx --yes @vscode/vsce@4 package --out "buildkite-pipeline-explorer-${{ steps.version.outputs.version }}.vsix"

      # --skip-duplicate makes re-runs safe if a later step failed.
      # Auth is OIDC trusted publishing: needs a policy on the publisher's
      # Trusted Publishing page naming this repo and release.yaml.
      - name: Publish to VS Code Marketplace
        if: steps.version.outputs.skip != 'true'
        run: npx --yes @vscode/vsce@4 publish --oidc --skip-duplicate --packagePath buildkite-pipeline-explorer-*.vsix

      # Open VSX trusted publishing only works once the extension exists, so
      # the first version needs an OVSX_PAT secret; delete it afterwards.
      - name: Publish to Open VSX
        if: steps.version.outputs.skip != 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx@1 publish buildkite-pipeline-explorer-*.vsix --skip-duplicate
          else
            unset OVSX_PAT
            npx --yes ovsx@1 publish buildkite-pipeline-explorer-*.vsix --skip-duplicate --trusted-publishing
          fi

      # Runs last: the tag is what marks a version as released.
      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" buildkite-pipeline-explorer-*.vsix \
            --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --generate-notes
